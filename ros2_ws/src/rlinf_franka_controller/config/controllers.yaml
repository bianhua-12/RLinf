/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      joint_impedance_controller:
        type: rlinf_franka_controller/JointImpedanceController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

  joint_impedance_controller:
    ros__parameters:
      arm_id: fr3
      k_alpha: 0.99
      k_gains: [240.0, 240.0, 240.0, 240.0, 100.0, 60.0, 20.0]
      d_gains: [20.0,  20.0,  20.0,  10.0,  10.0, 10.0,  5.0]
      reset_speed_factor: 0.1
      command_timeout: 0.5
      # The recent hardware faults are cartesian_reflex events. Keep the joint
      # thresholds at Franka defaults and raise only Cartesian thresholds.
      cartesian_collision_threshold_scale: 2.0
      collision_service_timeout: 2.0
      command_topic: rlinf/joint_targets
      reset_topic: rlinf/reset_joint_target

  franka_robot_state_broadcaster:
    ros__parameters:
      lock_update_success: true
      lock_log_error: false
