defaults:
  - realworld_dual_franka_joint
  - _self_

max_episode_steps: null
main_image_key: base_0_rgb
keyboard_reward_wrapper: start_end
keyboard_fifo_path: null
use_gello_joint: true
gello_joint_stream_period: 0.03333333333333333

init_params:
  id: Ros2DualFrankaJointEnv-v1

override_cfg:
  camera_fps: 30
  camera_first_frame_timeout_seconds: 3.0
  camera_max_stale_seconds: 1.0
  camera_recovery_initial_backoff_seconds: 0.5
  camera_recovery_max_backoff_seconds: 4.0
  camera_recovery_shutdown_timeout_seconds: 3.0
  step_frequency: 30
  joint_action_mode: absolute
  max_num_steps: 1000000
  teleop_direct_stream: true
  controlled_motion_tolerance: 0.03
  controlled_motion_timeout: 180.0
  controlled_motion_stable_time: 0.5
  ros_discovery_timeout: 2.0
  ros_state_max_age: 0.5
