# ReFL for Pi0.5 on ManiSkill PushCube: one-step x0 from a late flow state,
# scored by a frozen physical world model and the native dense reward.
defaults:
  - env/maniskill_push_cube_refl@env.train
  - env/maniskill_push_cube_refl@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "maniskill_refl_openpi_pi05_pushcube"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 25 # 40 updates per epoch: 1000 updates
  max_steps: -1
  only_eval: False
  val_check_interval: 2 # 512 validation episodes every 80 updates
  save_interval: 2
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: raw
  loss_type: embodied_refl
  loss_agg_func: "token-mean"

  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.0001
  clip_ratio_low: 0.0001
  clip_ratio_c: null
  gamma: 1.0
  gae_lambda: 1.0
  filter_rewards: False

  refl_margin: null      # maximise the imagined return directly (-r)
  refl_grad_scale: 1.0
  refl_pre_loss_weight: 0.0
  refl_xt_source: rollout

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 256
  eval:
    rollout_epoch: 2
    total_num_envs: 256
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    seed: 1000
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  collect_prev_infos: True
  enable_offload: False
  pipeline_stage_num: 4 # 64 envs per policy forward
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8 # full_chain keeps every flow step in the graph
  global_batch_size: 64
  seed: 0
  enable_offload: False

  refl_reward_model:
    type: physical_wm
    checkpoint_path: "/path/to/pushcube_physical_wm.pt"
    norm_stats_path: ${actor.model.openpi_data.norm_stats_path}
    horizon: 5   # imagined steps = executed chunk
    gamma: 0.99

  model:
    model_path: "/path/to/pushcube-pi05-sft" # contains actor/model_state_dict/full_weights.pt
    model_type: "openpi"
    precision: "bf16"
    add_value_head: False
    num_action_chunks: 5
    num_steps: 4
    policy_setup: panda-ee-delta-pose
    openpi:
      task: rl
      config_name: "pi05_maniskill"
      num_images_in_input: 1
      action_horizon: 10
      noise_method: "flow_ode"
      noise_level: 0.0
      joint_logprob: False
      train_expert_only: True
      refl_late_fraction: 0.5 # 4 flow steps: keep t = 0.5 and 0.25
      refl_grad_mode: full_chain
    openpi_data:
      norm_stats_path: "/path/to/pushcube/norm_stats.json"

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.0
    use_fp32_master_params: True
    clip_grad: 0.5
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    # Gemma and SigLIP run in bf16; the projections, norms and vision stem that
    # OpenPI keeps in fp32 stay there.
    wrappers:
      projections:
        module_names: ["action_*proj", "*time_mlp_*"]
      norms:
        module_classes: [RMSNorm]
      vision_embedding:
        module_names: [img, img.stem]
    mixed_precision_policies:
      fp32:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
      fp32_preserve_inputs:
        param_dtype: fp32
        reduce_dtype: fp32
        buffer_dtype: fp32
        cast_forward_inputs: false
    mixed_precision_rules:
      projections: fp32
      norms: fp32_preserve_inputs
      vision_embedding: fp32_preserve_inputs
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
      cast_forward_inputs: false
      cast_root_forward_inputs: false

reward:
  use_reward_model: False

critic:
  use_critic_model: False
